name: Auto-format Java

on:
  pull_request:
    branches:
      - master
      - dev
    paths:
      - 'src/**/*.java'

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: axel-op/googlejavaformat-action@fe78db8a90171b6a836449f8d0e982d5d71e5c5a #v3.6.0
        with:
          args: "--replace"
          skipCommit: false
          commitMessage: "style: apply Google Java Format"
