sponsorship.message.1 = Проект OWASP Security Shepherd выражает  благодарность за щедрую поддержку наших спонсоров. Без них Security Shepherd не существовала бы в том виде, в каком он существует сегодня. Пожалуйста, посетите их сайты и следите за ними в Твиттере.