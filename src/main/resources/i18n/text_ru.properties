blockedMessage.text.info.levelBlocked = У тебя отлично получается! Админ временно закрыл этот уровень. Чтобы узнать, когда этот уровень будет доступен, вам нужно будет спросить человека, который отвечает за приложение!
getStarted.text.moduleInfo.openFloor = Теперь, когда вы вошли в систему, давайте приступим к работе с некоторыми модулями Security Shepherd! Чтобы запустить модуль, нажмите на заголовки списка, <span><a>Lessons</a></span> или <span><a>МModeules</a></span> в боковом меню, чтобы увидеть, какие модули уже доступны!
getStarted.text.moduleInfo.incrementalFloor = Теперь, когда вы вошли в систему, давайте начнем с некоторых испытаний Security Shepherd! Чтобы начать его, нажмите кнопку &quot;Get Next Challenge&quot; кнопка слева!
getStarted.text.moduleInfo = Теперь, когда вы вошли в систему, давайте приступим к работе с некоторыми модулями Security Shepherd! Чтобы запустить модуль, нажмите на заголовки списка, такие как <span><a>Field Training</a></span> или <span><a>Капрал</a></span>, в боковом меню чтобы увидеть, какие модули доступны в настоящее время! Чем ниже в боковом меню указан модуль, тем больше очков он вам принесет!
getStarted.text.configureShepherd.asAnAdmin = Поскольку вы являетесь администратором, вы можете определить область применения Security Shepherd. Вы можете быстро изменить макет игры на веб или мобильное приложение, используя следующие кнопки, или вы можете открыть меню «Управление модулем администратора» в левом верхнем углу страницы, чтобы открывать/закрывать определенные темы.
getStarted.text.checkShepConfigMsg = Если вы не видите сообщение под этим параграфом, убедитесь, что экземпляр Security Shepherd настроен правильно.
getStarted.text.info.changePassword = 
Ваш пароль является временным паролем. Это значит, что кто-то знает ваш пароль! Давайте позаботимся о безопасности и поменяем пароль прямо сейчас!
getStarted.text.info.changeUsername = У вас есть возможность изменить имя пользователя здесь. Это имя будет публично на табло
login.text.info = Используйте свои <a><span>учетные данные Security Shepherd<span></a> для входа.
login.text.regInfo = Зарегистрируйте <a href="register.jsp"><span>Security Shepherd Account</span></a> здесь!
login.text.scoreboard = Просмотрите  <a href="scoreboard.jsp"><span>scoreboard</span></a>.
login.text.about_blurb = Проект OWASP Security Shepherd был разработан и реализован для повышения осведомленности о безопасности приложений среди различных демографических навыков. Этот проект позволяет пользователям изучать или улучшать существующие навыки тестирования на проникновение. Это доступно с помощью методов урока и вызова. Урок предоставляет пользователю помощь в завершении этого модуля, где задача ставит то, что пользователь узнал на уроке, для использования. </p><p>Проект OWASP Security Shepherd покрывает риски из первой десятки веб-приложений OWASP, а также риски из первой десятки мобильных приложений OWASP. Используя эти риски в качестве испытательного полигона, можно изучить распространенные уязвимости безопасности и понять их влияние на систему. Многие из этих уровней включают недостаточное снижение и защиту от этих рисков, таких как фильтры черного списка, ужасные схемы кодирования, варварские механизмы безопасности и плохая конфигурация безопасности. Модули были созданы, чтобы бросить вызов не только новичкам, но и профессионалам в области безопасности.
login.text.sponsers_blurb = Проект OWASP Security Shepherd благодарен за щедрую поддержку наших спонсоров. Пожалуйста, посетите их сайты и следите за ними в Твиттере.
login.text.thanks = Проект OWASP Security Shepherd также благодарит доктора Энтони Кина и Исследовательскую лабораторию безопасности ITB за размещение общедоступной страницы https://owasp.securityShepherd.eu.
readyToPlay.text.info.notReady = Обновите главную страницу! Если эта ошибка повторяется; Пожалуйста, выйдите и войдите! Если эта ошибка продолжает повторяться, обратитесь к администратору!
readyToPlay.text.info.enteredGame = Теперь, когда вы можете видеть это, вы готовы к работе! Работайте над уроками и задачами! <br/><br/> Помните, что уровни, в которые вы играете, являются дополнительными приложениями. Продолжайте играть в этих приложениях! Держитесь подальше от своего идентификатора сеанса! Если вы измените их, вы просто выйдете из системы!<br/><br/> Если вы еще не настроили веб-прокси, лучше сделайте это сейчас! Это делает все намного проще!

